<script>
const C={
rq:{t:"Research question — the one thing your thesis answers",b:"Your thesis asks: does an LSTM model trained on calm 2010–2019 market data degrade in accuracy when tested on extreme stress scenarios? And does that degradation violate Article 15 of the EU AI Act? Think of it like training a driver on quiet country roads and then putting them in a Formula 1 race — does their skill hold up?",e:"RQ: Does LSTM accuracy drop under GJR-GARCH stress, violating EU AI Act Article 15?"},
art15:{t:"Article 15 — the law your thesis tests against",b:"Article 15 of the EU AI Act says high-risk AI systems must achieve an appropriate level of accuracy, robustness and cybersecurity throughout their lifecycle. It does NOT specify what number accuracy must be. Your thesis builds a framework proposing what that number should be for AI trading systems — and tests whether your model meets it.",e:"Art 15(1): High-risk AI systems shall achieve an appropriate level of accuracy and robustness"},
gjr:{t:"GJR-GARCH — the volatility engine",b:"GARCH models how volatile financial markets are over time. The GJR version adds one key idea: bad news causes MORE future volatility than good news of the same size. This is the leverage effect. You use GJR-GARCH to estimate what normal and crisis market behaviour look like, then use those parameters to generate synthetic crisis scenarios for stress testing.",e:"σ²t = ω + α·ε²t-1 + γ·I(ε<0)·ε²t-1 + β·σ²t-1   where γ = leverage effect"},
mc:{t:"Monte Carlo simulation — the crisis generator",b:"Instead of testing on just the real 2008 crash or COVID (two events), you generate 10,000 simulated paths that behave like those crises — same statistical properties, different random numbers each time. This gives you enough data to measure accuracy with proper statistics rather than just observation.",e:"10,000 paths × 252 trading days = 2.52 million simulated days per scenario"},
lstm:{t:"LSTM — the AI model being stress tested",b:"Long Short-Term Memory is a neural network that reads sequences in order and remembers patterns over time. Your LSTM reads 60 days of past returns and predicts whether tomorrow will be HIGH or LOW volatility. It was trained ONLY on calm 2010–2019 data — stress testing shows how it behaves on data it has never seen.",e:"Input: 60 days returns → LSTM(32 units) → Dense(16) → Output: P(HIGH volatility)"},
lev:{t:"Leverage effect — why crashes hurt more than rallies help",b:"If the market falls 3% today, future volatility rises MORE than if the market rose 3%. Your GJR-GARCH captures this with the γ parameter. In your results, γ is higher during COVID (0.3328) than during 2008 (0.1301), meaning negative shocks had 26% more impact during the pandemic period.",e:"Pre-COVID γ=0.2793 vs COVID γ=0.3328 — negative shocks more impactful during pandemic"},
scen:{t:"6 stress scenarios — the testing conditions",b:"You test the model under 6 simulated market conditions: Normal (baseline), 2008-style crisis (2.5× shock), COVID-style (1.8× shock), Synthetic Extreme (3× shock), Non-linear Squeeze (exponentially growing shock), and Structural Break (sudden regime change). Each asks: at what point does the model stop working reliably?",e:"Normal(1×) → COVID(1.8×) → 2008(2.5×) → Extreme(3×) → Squeeze(exp) → Break(regime)"},
scaler:{t:"StandardScaler — the preprocessing step that matters",b:"Before feeding data to the LSTM you standardise it — subtract the mean and divide by standard deviation. The critical rule: fit the scaler on TRAINING data only, then apply it unchanged to test data. If you fit a new scaler on stress scenario data, you remove the very differences you are trying to measure — like washing fingerprints off before checking for them.",e:"scaler.fit(X_train)  ← fit once on 2010-2019\nscaler.transform(X_stress)  ← apply same to crisis data"},
garch_result:{t:"GARCH results — what the parameters reveal",b:"Your Table 1 shows how volatility behaved differently in each period. The key finding: during COVID, the baseline variance ω jumps to 0.1149 — 714× higher than pre-2008 (0.000161). This is mathematical proof that COVID was a genuine structural break, not just a bigger version of 2008. Persistence stays close to 1 in all periods, meaning volatility shocks take a long time to fade.",e:"COVID ω=0.1149 vs Pre-2008 ω=0.000161 — baseline variance 714× higher"},
stress_result:{t:"Stress test results — the main empirical finding",b:"After fixing the scaler, your regularized LSTM shows real degradation: 2008 crisis −0.32pp, COVID −0.85pp, Structural Break −0.64pp. COVID causes the worst degradation, which makes sense — it was the most structurally different scenario from the training data. The model trained on calm 2010–2019 markets struggles most under pandemic-level chaos.",e:"Normal: 49.90% | COVID: 49.05% | Change: −0.85pp (worst degradation in all scenarios)"},
reg_result:{t:"Regularization — why it matters for robustness",b:"Regularization stops the model from memorising training data too precisely. You use Dropout (randomly switching off neurons) and ReduceLROnPlateau (gradually slowing the learning rate). The comparison: simple LSTM degrades 3.65pp under non-linear squeeze, while the regularized one stays stable. Regularization is not just about accuracy — it is about robustness under stress.",e:"Simple LSTM: 52.29% → 48.64% (−3.65pp) | Regularized: 50.73% → 51.81% (+1.08pp)"},
cont:{t:"Contamination test — your most original finding",b:"You discovered the non-linear squeeze showed improvement instead of degradation. So you designed an experiment: control how many squeeze days the model can SEE in its lookback window. Result: blind (0 days) = 50.70%, partially visible (10 days) = 61.87% (easy labels), deeply contaminated (40 days) = 46.86% — below random guess. Three phases, one clean story.",e:"0d blind: 50.70% | 10d visible: 61.87% (label skew) | 40d deep: 46.86% (below chance)"},
ztest:{t:"Z-test and r=0.9335 — the statistical proof",b:"The correlation of r=0.9335 between HIGH label percentage and accuracy is your most powerful result: 93% of accuracy variation across contamination levels is explained by label distribution — not by the model learning about stress. The model was getting easier questions, not getting better at answering them. This single number proves the contamination artefact.",e:"Pearson r = 0.9335 between HIGH label% and LSTM accuracy across contamination levels"},
emh:{t:"Efficient Market Hypothesis — why ~50% accuracy is expected",b:"The EMH says prices already reflect all available information, so future movements cannot be predicted above chance. This is why your LSTM achieves only ~50% directional accuracy — not because it is a bad model, but because the market is genuinely hard to beat. Your thesis is about whether accuracy stays STABLE under stress, not about achieving high accuracy. That is a completely different and more important question.",e:"EMH: ~50% directional accuracy expected | Your question: does it stay stable under stress?"},
policy:{t:"Policy contribution — what regulators should do",b:"Your thesis proposes tiered accuracy buffer thresholds analogous to Basel III capital buffers for banks. Just as banks hold more capital under more risk, AI trading systems should face more scrutiny when accuracy drops more. Compliant ≤3pp drop, Enhanced monitoring 3–5pp, Restricted trading 5–10pp, Non-compliant >10pp. This operationalises Article 15 with real numbers for the first time.",e:"Drop ≤3pp → Compliant | 3–5pp → Monitoring | 5–10pp → Restricted | >10pp → Non-compliant"},
fsb:{t:"FSB 2024 — the regulatory motivation",b:"The Financial Stability Board's November 2024 report concluded that AI in finance may amplify financial sector vulnerabilities including model risk, potentially increasing systemic risk. This is your policy motivation — regulators themselves are calling for frameworks like yours. The FSB identified the gap; your thesis begins to fill it.",e:"FSB (Nov 2024): AI may amplify systemic risk through model risk and market correlation"},
esrb:{t:"ESRB ASC No.16 — Cecchetti et al. 2025 — the capital buffer anchor",b:"The European Systemic Risk Board explicitly recommended revisiting capital and liquidity requirements for institutions using AI. They proposed skin-in-the-game requirements and sophistication thresholds. Your Basel III proportionality framework directly operationalises their recommendation — connecting your empirical degradation results to their theoretical proposal for prudential capital surcharges.",e:"ESRB (2025): recommends revisiting prudential capital requirements for AI-using institutions"}
};

function show(id){
  const c=C[id];
  if(!c)return;
  document.getElementById('et').textContent=c.t;
  document.getElementById('eb').textContent=c.b;
  const ee=document.getElementById('ee');
  if(c.e){ee.textContent=c.e;ee.style.display='block';}
  else ee.style.display='none';
  const box=document.getElementById('exp');
  box.classList.add('on');
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function cls(){document.getElementById('exp').classList.remove('on');}
</script>
